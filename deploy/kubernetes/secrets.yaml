apiVersion: v1
kind: Secret
metadata:
  name: kiln
  namespace: kiln
type: Opaque
stringData:
  app-private-key: replace with the GitHub App private key (PEM)
  webhook-secret: replace with the GitHub App webhook secret
  oauth-client-secret: replace with the GitHub App client secret
  registry-password: replace with a token that may push packages
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-push
  namespace: kiln-builds
type: Opaque
stringData:
  username: example
  password: replace with a token that may push packages

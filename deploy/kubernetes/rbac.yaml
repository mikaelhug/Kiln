apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiln
  namespace: kiln
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kiln
  namespace: kiln-builds
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, delete]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kiln
  namespace: kiln-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kiln
subjects:
  - kind: ServiceAccount
    name: kiln
    namespace: kiln

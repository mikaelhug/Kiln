[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mikaelhug/kiln"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
kiln-core = { path = "crates/core" }
kiln-github = { path = "crates/github" }
kiln-registry = { path = "crates/registry" }
kiln-runner = { path = "crates/runner" }
kiln-store = { path = "crates/store" }

anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
indexmap = { version = "2.14.2", features = ["serde"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.1.0", default-features = false, features = ["client", "runtime", "rustls-tls"] }
maud = { version = "0.27.0", features = ["axum"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "form", "stream"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
schemars = { version = "1.2.3", features = ["indexmap2"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
tower-http = { version = "0.7.1", features = ["trace", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

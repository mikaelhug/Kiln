[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
kiln-core = { path = "crates/core" }

anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
schemars = { version = "1.2.3", features = ["indexmap2"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.2.1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

name: Bug report
description: Something in Kiln does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what Kiln did instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: .kiln.toml
      description: The configuration involved, with secrets and private names removed.
      render: toml
  - type: textarea
    id: logs
    attributes:
      label: Kiln server log
      description: The relevant lines from the server log.
      render: text
  - type: input
    id: version
    attributes:
      label: Kiln version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: cluster
    attributes:
      label: Kubernetes version and distribution
      placeholder: "1.37, Talos"

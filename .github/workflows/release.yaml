name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kiln

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release tags look like v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=main" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ github.ref_type == 'tag' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: binary
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Package
        run: |
          mkdir -p out
          tar -C dist -czf "out/kiln-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" kiln
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "${{ steps.build.outputs.digest }}" > "out/digest-${{ matrix.arch }}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-${{ matrix.arch }}
          path: out/
          retention-days: 7

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo build --release --locked -p kiln
      - name: Package
        run: |
          mkdir -p out
          tar -C target/release -czf "out/kiln-${{ needs.version.outputs.version }}-macos-arm64.tar.gz" kiln
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-arm64
          path: out/
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: [version, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        name: Publish the multi-arch image
        run: |
          version="${{ needs.version.outputs.version }}"
          sources=$(for file in artifacts/digest-*; do printf '%s@%s ' "$IMAGE" "$(cat "$file")"; done)
          docker buildx imagetools create -t "$IMAGE:$version" $sources
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.version.outputs.version }}"
          cd artifacts
          sha256sum kiln-*.tar.gz > SHA256SUMS
          awk -v v="$version" '$0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } } found' ../CHANGELOG.md > notes.md
          printf '\nImage: `%s:%s@%s`\n' "$IMAGE" "$version" "${{ steps.manifest.outputs.digest }}" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "Kiln $version" --notes-file notes.md --verify-tag kiln-*.tar.gz SHA256SUMS
